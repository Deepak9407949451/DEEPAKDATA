        // Format Currency Helper

        // Main App Component
        function App() {
            const [records, setRecords] = useState(() => {
                const localData = localStorage.getItem("med_tpa_records");
                return localData ? JSON.parse(localData) : defaultMockData;
            });

            // Save to localStorage
            useEffect(() => {
                localStorage.setItem("med_tpa_records", JSON.stringify(records));
            }, [records]);

            const [selectedCategory, setSelectedCategory] = useState("primary");
            const [searchTerm, setSearchTerm] = useState("");
            const [activeFilter, setActiveFilter] = useState("all");
            
            // Apps Script URL & Sheets Integration
            const [sheetLink, setSheetLink] = useState(() => localStorage.getItem("med_tpa_sheet_link") || "");
            const [appsScriptUrl, setAppsScriptUrl] = useState(() => localStorage.getItem("med_tpa_script_url") || "");
            const [isAutoSyncEnabled, setIsAutoSyncEnabled] = useState(false);
            const [sheetsMessage, setSheetsMessage] = useState(null);
            const [syncLoading, setSyncLoading] = useState(false);
            const [isConfigOpen, setIsConfigOpen] = useState(false);

            // Modals & Forms State
            const [isFormOpen, setIsFormOpen] = useState(false);
            const [isViewModalOpen, setIsViewModalOpen] = useState(false);
            const [selectedRecord, setSelectedRecord] = useState(null);
            const [isInvoiceModalOpen, setIsInvoiceModalOpen] = useState(false);
            const [isPrintModalOpen, setIsPrintModalOpen] = useState(false);
            const [bulkPrintRecords, setBulkPrintRecords] = useState([]);

            // Form inputs
            const [formData, setFormData] = useState({
                patientName: "",
                gender: "Male",
                contactNumber: "",
                uhid: "",

                policyNumber: "",

            // Save Apps Script & sheets info
            useEffect(() => {
                localStorage.setItem("med_tpa_sheet_link", sheetLink);
            }, [sheetLink]);

            useEffect(() => {
                localStorage.setItem("med_tpa_script_url", appsScriptUrl);
            }, [appsScriptUrl]);

            // Form change handler
            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => {
                    const updated = { ...prev, [name]: value };

                    // Auto Fill TPA address
                    if ((name === "tpaCompanyName" || name === "insuranceCompanyName") && value) {
                        const foundAddress = getTpaAddress(
                            name === "tpaCompanyName" ? value : prev.tpaCompanyName,
                            name === "insuranceCompanyName" ? value : prev.insuranceCompanyName
                        );
                        if (foundAddress) {
                            updated.insuranceAddress = foundAddress;
                        }
                    }

                    // Auto Fill TDS / Net calculations
                    if (name === "finalApprovedAmount" || name === "tdsRate" || name === "totalBilledAmount" || name === "discount" || name === "initialApprovedAmount") {
                        const finalApp = parseFloat(updated.finalApprovedAmount) || 0;
                        const tds = parseFloat(updated.tdsRate) || 0;
                        const billed = parseFloat(updated.totalBilledAmount) || 0;
                        const disc = parseFloat(updated.discount) || 0;
                        
                        updated.tdsDeductedAmount = ((finalApp * tds) / 100).toFixed(2);
                        updated.netPayableAmount = (finalApp - parseFloat(updated.tdsDeductedAmount)).toFixed(2);
                        
                        // Deducted & Patient payable math
                        const approvedAndDiscount = finalApp + disc;
                        updated.totalDeductedAmount = Math.max(0, billed - approvedAndDiscount).toFixed(2);
                        updated.patientPayableAmount = Math.max(0, billed - approvedAndDiscount).toFixed(2);
                    }

                    return updated;
                });
            };

            // Add new Patient Record
            const handleFormSubmit = (e) => {
                e.preventDefault();
                if (!formData.patientName || !formData.uhid) {
                    alert("Patient Name and UHID are required fields!");
                    return;
                }

                    ...formData,
                    serialNumber: sNo,
                    totalBilledAmount: parseFloat(formData.totalBilledAmount) || 0,

            };

            // Sync with Google Sheets
            const triggerSyncToSheets = async () => {
                if (!appsScriptUrl) {
                    setSheetsMessage({ type: "error", text: "Please enter your deployed Google Apps Script Web App URL first." });
                    return;
                }
                setSyncLoading(true);
                setSheetsMessage({ type: "success", text: "Transmitting data to Google Sheets..." });

                try {
                    const response = await fetch(appsScriptUrl, {
                        method: "POST",
                        mode: "no-cors",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(records)
                    });
                    setSheetsMessage({ type: "success", text: "Data sync request transmitted! Google Apps Script is writing records in real-time." });
                } catch (err) {
                    setSheetsMessage({ type: "error", text: err.message || "Google Apps Script sync failed. Check URL." });
                } finally {
                    setSyncLoading(false);
                }
            };

            // Export to CSV
            const handleExportCSV = () => {
                let headers = [
                    "S.No", "Patient Name", "Gender", "Contact Number", "UHID (UID)", "Member ID", "Policy Number", "Employee ID", "Claim Number", "Diagnosis", "Surgery Name", "Admission Status", "Admission Date", "Discharge Date", "IP Billing Number", "Insurance Company", "TPA Company", "Total Billed Amount", "Initial Approved", "Final Approved", "Discount", "Total Deducted", "Patient Payable", "TDS Rate (%)", "TDS Deducted", "Net Payable", "Settled Amount", "Payment Received", "Settlement Status", "PAN Card", "Bank Name", "Account Number", "IFSC Code", "Bank Address", "UTR Number", "UTR Date", "Courier Service", "Courier POD #", "Courier Date", "Insurance Limit", "Attender Name", "Relation", "Insurance Address", "Remarks"
                ];

                const keyMap = {
                    "S.No": "serialNumber",
                    "Patient Name": "patientName",
                    "Gender": "gender",
                    "Contact Number": "contactNumber",
                    "UHID (UID)": "uhid",
                    "Member ID": "memberId",
                    "Policy Number": "policyNumber",
                    "Employee ID": "employeeId",
                    "Claim Number": "claimNumber",
                    "Diagnosis": "diagnosis",
                    "Surgery Name": "surgeryName",
                    "Admission Status": "admissionStatus",
                    "Admission Date": "admissionDate",
                    "Discharge Date": "dischargeDate",
                    "IP Billing Number": "ipBillingNumber",
                    "Insurance Company": "insuranceCompanyName",
                    "TPA Company": "tpaCompanyName",
                    "Total Billed Amount": "totalBilledAmount",
                    "Initial Approved": "initialApprovedAmount",
                    "Final Approved": "finalApprovedAmount",
                    "Discount": "discount",
                    "Total Deducted": "totalDeductedAmount",
                    "Patient Payable": "patientPayableAmount",
                    "TDS Rate (%)": "tdsRate",
                    "TDS Deducted": "tdsDeductedAmount",
                    "Net Payable": "netPayableAmount",
                    "Settled Amount": "settledAmount",
                    "Payment Received": "paymentReceived",
                    "Settlement Status": "settlementStatus",
                    "PAN Card": "pan",
                    "Bank Name": "bankName",
                    "Account Number": "bankAccountNumber",
                    "IFSC Code": "ifscCode",
                    "Bank Address": "bankAddress",
                    "UTR Number": "utrNumber",
                    "UTR Date": "utrDate",
                    "Courier Service": "courierServiceName",
                    "Courier POD #": "courierPodNumber",
                    "Courier Date": "courierDate",
                    "Insurance Limit": "insuranceLimit",
                    "Attender Name": "attenderName",
                    "Relation": "relation",
                    "Insurance Address": "insuranceAddress",
                    "Remarks": "remarks"
                };

                const csvContent = [
                    headers.join(","),
                    ...records.map(record => {
                        return headers.map(h => {
                            let val = record[keyMap[h]];
                            
                            // Fix S.No to export as raw clean sequence number (e.g. 1, 2, 3 instead of SN-1)
                            if (keyMap[h] === "serialNumber" && typeof val === "string") {
                                const numericPart = val.replace(/[^0-9]/g, "");
                                val = numericPart || val;
                            }

                            // Proper formatting for numbers to avoid Excel errors
                            if (typeof val === "number") {
                                if (isNaN(val)) val = 0;
                                else val = Math.round((val + Number.EPSILON) * 100) / 100;
                            }

                            const stringified = val !== undefined && val !== null ? String(val) : "";
                            return `"${stringified.replace(/"/g, '""')}"`;
                        }).join(",");
                    })
                ].join("\n");

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", `TPA_Claims_Export_${new Date().toISOString().slice(0,10)}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // Filter & Search Records
            const filteredRecords = useMemo(() => {
                return records.filter(r => {
                    const matchSearch = (
                        r.patientName?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        r.uhid?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        r.policyNumber?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        r.claimNumber?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        r.insuranceCompanyName?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        r.tpaCompanyName?.toLowerCase().includes(searchTerm.toLowerCase())
                    );

                    if (activeFilter === "all") return matchSearch;
                    if (activeFilter === "admitted") return matchSearch && r.admissionStatus === "Admitted";
                    if (activeFilter === "discharged") return matchSearch && r.admissionStatus === "Discharged";
                    if (activeFilter === "settled") return matchSearch && r.settlementStatus === "Settled";
                    if (activeFilter === "pending") return matchSearch && r.settlementStatus === "Pending";
                    return matchSearch;
                });
            }, [records, searchTerm, activeFilter]);

            // Totals for Live Claims Desk
            const totalCount = filteredRecords.length;
            const totalAmountSum = filteredRecords.reduce((sum, r) => sum + (r.totalBilledAmount || 0), 0);

            // Delete Record
            const handleDeleteRecord = (sNo) => {
                if (confirm(`Are you sure you want to delete claim ${sNo}?`)) {

// (Extensions > Apps Script)

function doGet(e) {

    "UTR Number": "utrNumber",

    "Courier Service": "courierServiceName",
    "Courier POD #": "courierPodNumber",
    "Courier Date": "courierDate",

    "Attender Name": "attenderName",
    "Relation": "relation",
    "Insurance Address": "insuranceAddress",
    "Remarks": "remarks"
  };
  
  for (var i = 1; i < rows.length; i++) {
    var row = rows[i];
    var obj = {};
    for (var j = 0; j < headers.length; j++) {
      var headerName = headers[j].toString().trim();
      var key = keyMap[headerName] || headerName;
      obj[key] = row[j];
    }
    data.push(obj);
  }
  
  var response = JSON.stringify(data);
  return ContentService.createTextOutput(response)
    .setMimeType(ContentService.MimeType.JSON)

}

function doPost(e) {
  var lock = LockService.getScriptLock();
  try {
    lock.waitLock(15000);
    
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
    var payload = JSON.parse(e.postData.contents);
    
    if (!Array.isArray(payload)) {
      return ContentService.createTextOutput(JSON.stringify({ success: false, error: "Invalid array" }))
        .setMimeType(ContentService.MimeType.JSON)
        .setHeader("Access-Control-Allow-Origin", "*");
    }
    
    sheet.clear();
    
    var headers = [
      "S.No", "Patient Name", "Gender", "Contact Number", "UHID (UID)", "Member ID", "Policy Number", "Employee ID", "Claim Number", "Diagnosis", "Surgery Name", "Admission Status", "Admission Date", "Discharge Date", "IP Billing Number", "Insurance Company", "TPA Company", "Total Billed Amount", "Initial Approved", "Final Approved", "Discount", "Total Deducted", "Patient Payable", "TDS Rate (%)", "TDS Deducted", "Net Payable", "Settled Amount", "Payment Received", "Settlement Status", "PAN Card", "Bank Name", "Account Number", "IFSC Code", "Bank Address", "UTR Number", "UTR Date", "Courier Service", "Courier POD #", "Courier Date", "Insurance Limit", "Attender Name", "Relation", "Insurance Address", "Remarks"
    ];
    
    var keyMap = {
      "S.No": "serialNumber",
      "Patient Name": "patientName",
      "Gender": "gender",
      "Contact Number": "contactNumber",
      "UHID (UID)": "uhid",
      "Member ID": "memberId",

      "Final Approved": "finalApprovedAmount",

      "Bank Name": "bankName",
      "Account Number": "bankAccountNumber",
      "IFSC Code": "ifscCode",
      "Bank Address": "bankAddress",
      "UTR Number": "utrNumber",
      "UTR Date": "utrDate",
      "Courier Service": "courierServiceName",
      "Courier POD #": "courierPodNumber",
      "Courier Date": "courierDate",
      "Insurance Limit": "insuranceLimit",
      "Attender Name": "attenderName",
      "Relation": "relation",
      "Insurance Address": "insuranceAddress",
      "Remarks": "remarks"
    };
    
    var values2D = [];
    values2D.push(headers);
    
    for (var i = 0; i < payload.length; i++) {
      var item = payload[i];
      var row = [];
      for (var j = 0; j < headers.length; j++) {
        var key = keyMap[headers[j]];
        var val = item[key];
        
        if (key === "serialNumber" && typeof val === "string") {
          var numPart = val.replace(/[^0-9]/g, "");
          val = numPart ? parseInt(numPart, 10) : val;
        }
        
        row.push(val !== undefined && val !== null ? val : "");
      }
      values2D.push(row);
    }
    
    var numRows = values2D.length;
    var numCols = headers.length;
    var range = sheet.getRange(1, 1, numRows, numCols);
    
    // Set text format BEFORE writing values to prevent truncation/scientific notation of leading zeros
    for (var col = 1; col <= numCols; col++) {
      var headerName = headers[col - 1];
      var targetRange = sheet.getRange(2, col, numRows - 1, 1);
      
      if (headerName === "S.No" || headerName === "Member ID" || headerName === "Policy Number" || headerName === "Claim Number" || headerName === "Account Number" || headerName === "IFSC Code" || headerName === "UTR Number" || headerName === "Courier POD #" || headerName === "Employee ID" || headerName === "PAN Card") {
        targetRange.setNumberFormat("@");
      }
    }
    
    range.setValues(values2D);
    range.setHorizontalAlignment("left");
    
    var headerRange = sheet.getRange(1, 1, 1, numCols);
    headerRange.setFontWeight("bold");
    headerRange.setBackground("#2563eb");
    headerRange.setFontColor("#ffffff");

    for (var col = 1; col <= numCols; col++) {
      var headerName = headers[col - 1];
      var targetRange = sheet.getRange(2, col, numRows - 1, 1);
      
      if (headerName.indexOf("Amount") !== -1 || headerName === "Initial Approved" || headerName === "Final Approved" || headerName === "Discount" || headerName === "Total Deducted" || headerName === "Patient Payable" || headerName === "TDS Deducted" || headerName === "Net Payable" || headerName === "Insurance Limit" || headerName === "Settled Amount") {
        targetRange.setNumberFormat(currencyFormat);
      } else if (headerName === "TDS Rate (%)") {
        targetRange.setNumberFormat(percentFormat);
      }
    }
    
    sheet.autoResizeColumns(1, numCols);
    
    return ContentService.createTextOutput(JSON.stringify({ success: true, count: payload.length }))
      .setMimeType(ContentService.MimeType.JSON)
      .setHeader("Access-Control-Allow-Origin", "*");
      
  } catch(e) {
    return ContentService.createTextOutput(JSON.stringify({ success: false, error: e.toString() }))
      .setMimeType(ContentService.MimeType.JSON)
      .setHeader("Access-Control-Allow-Origin", "*");
  } finally {
    lock.releaseLock();
  }
}`;

                                            <label class="block text-[10px] font-bold text-slate-500 uppercase">Discharge Date</label>
                                            <input type="date" name="dischargeDate" value={formData.dischargeDate} onChange={handleInputChange} class="w-full p-2 border rounded font-mono" />
                                        </div>
                                        <div>
                                            <label class="block text-[10px] font-bold text-slate-500 uppercase">IP Billing Number</label>
                                            <input name="ipBillingNumber" value={formData.ipBillingNumber} onChange={handleInputChange} class="w-full p-2 border rounded font-mono" />
                                        </div>
                                        <div>
                                            <label class="block text-[10px] font-bold text-slate-500 uppercase">TPA Company Name</label>
                                            <select name="tpaCompanyName" value={formData.tpaCompanyName} onChange={handleInputChange} class="w-full p-2 border rounded">
                                                <option value="">Select TPA...</option>
                                                {Object.keys(tpaInsuranceAddresses).map(t => (
                                                    <option key={t} value={t}>{t}</option>
                                                ))}
                                            </select>
                                        </div>
                                        {/* Row 6 */}
                                        <div>
                                            <label class="block text-[10px] font-bold text-slate-500 uppercase">Insurance Company Name</label>
                                            <input name="insuranceCompanyName" value={formData.insuranceCompanyName} onChange={handleInputChange} class="w-full p-2 border rounded" />
                                        </div>
                                        <div>
                                            <label class="block text-[10px] font-bold text-slate-500 uppercase">Total Billed Amount (₹)</label>
                                            <input type="number" name="totalBilledAmount" value={formData.totalBilledAmount} onChange={handleInputChange} class="w-full p-2 border rounded font-mono" />
                                        </div>
                                        <div>
                                            <label class="block text-[10px] font-bold text-slate-500 uppercase">Initial Approved Amount (₹)</label>
                                            <input type="number" name="initialApprovedAmount" value={formData.initialApprovedAmount} onChange={handleInputChange} class="w-full p-2 border rounded font-mono" />
                                        </div>
                                        {/* Row 7 */}
                                        <div>
                                            <label class="block text-[10px] font-bold text-slate-500 uppercase">Final Approved Amount (₹)</label>
                                            <input type="number" name="finalApprovedAmount" value={formData.finalApprovedAmount} onChange={handleInputChange} class="w-full p-2 border rounded font-mono" />
                                        </div>
                                        <div>
                                            <label class="block text-[10px] font-bold text-slate-500 uppercase">Discount (₹)</label>
                                            <input type="number" name="discount" value={formData.discount} onChange={handleInputChange} class="w-full p-2 border rounded font-mono" />
                                        </div>
                                        <div>
                                            <label class="block text-[10px] font-bold text-slate-500 uppercase">TDS Rate (%)</label>
                                            <select name="tdsRate" value={formData.tdsRate} onChange={handleInputChange} class="w-full p-2 border rounded font-mono">
                                                <option value="10">10%</option>
                                                <option value="5">5%</option>
                                                <option value="2">2%</option>
                                                <option value="0">0%</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="border border-slate-200 p-3 bg-slate-50 rounded">
                                        <h4 class="text-[10px] font-bold uppercase text-slate-500 mb-2">Policy, Insurance & TPA Metadata</h4>
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            <div>
                                                <label class="block text-[10px] font-bold text-slate-500 uppercase">Insurance Address (Auto-filled on TPA change)</label>
                                                <textarea name="insuranceAddress" value={formData.insuranceAddress} onChange={handleInputChange} class="w-full p-2 border rounded bg-white text-[10.5px] font-sans h-20" />
                                            </div>
                                            <div>
                                                <label class="block text-[10px] font-bold text-slate-500 uppercase">Special Remarks / Internal Audit Notes</label>
                                                <textarea name="remarks" value={formData.remarks} onChange={handleInputChange} class="w-full p-2 border rounded bg-white text-[10.5px] font-sans h-20" />
                                            </div>
                                        </div>
                                    </div>
                                    <div class="p-3 border-t flex justify-end gap-2 shrink-0 bg-slate-50">
                                        <button type="button" onClick={() => setIsFormOpen(false)} class="px-4 py-2 border rounded bg-white text-slate-700 hover:bg-slate-100 font-bold uppercase tracking-wider text-[10.5px]">Cancel</button>
                                        <button type="submit" class="px-5 py-2 rounded bg-blue-600 hover:bg-blue-500 text-white font-bold uppercase tracking-wider text-[10.5px]">Save Claim</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: View/Edit Modal */}
                    {isViewModalOpen && selectedRecord && (
                        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 p-4 overflow-y-auto no-print">
                            <div class="bg-white rounded-xl shadow-2xl border border-slate-200 w-full max-w-4xl">
                                <header class="p-4 border-b flex items-center justify-between bg-slate-900 text-white rounded-t-xl">
                                    <h3 class="font-extrabold text-sm uppercase tracking-wide">Claim File: {selectedRecord.patientName} ({selectedRecord.serialNumber})</h3>
                                    <button onClick={() => setIsViewModalOpen(false)} class="text-slate-400 hover:text-white">
                                        <i data-lucide="x" class="h-5 w-5"></i>
                                    </button>
                                </header>
                                <div class="p-6 grid grid-cols-2 md:grid-cols-4 gap-4 text-xs max-h-[80vh] overflow-y-auto">
                                    <div>
                                        <span class="text-[10px] font-bold text-slate-400 uppercase block tracking-wider">Patient Name</span>
                                        <span class="font-semibold text-slate-800">{selectedRecord.patientName}</span>
                                    </div>
                                    <div>
                                        <span class="text-[10px] font-bold text-slate-400 uppercase block tracking-wider">Gender</span>
                                        <span class="font-semibold text-slate-800">{selectedRecord.gender}</span>
                                    </div>
                                    <div>
                                        <span class="text-[10px] font-bold text-slate-400 uppercase block tracking-wider">Contact Number</span>
                                        <span class="font-semibold text-slate-800 font-mono">{selectedRecord.contactNumber}</span>
                                    </div>
                                    <div>
                                        <span class="text-[10px] font-bold text-slate-400 uppercase block tracking-wider">UHID (UID)</span>
                                        <span class="font-semibold text-slate-800 font-mono">{selectedRecord.uhid}</span>
                                    </div>
                                    <div>
                                        <span class="text-[10px] font-bold text-slate-400 uppercase block tracking-wider">TPA Company</span>
                                        <span class="font-semibold text-slate-800">{selectedRecord.tpaCompanyName || "N/A"}</span>
                                    </div>
                                    <div>
                                        <span class="text-[10px] font-bold text-slate-400 uppercase block tracking-wider">Insurance Company</span>
                                        <span class="font-semibold text-slate-800">{selectedRecord.insuranceCompanyName || "N/A"}</span>
                                    </div>
                                    <div>
                                        <span class="text-[10px] font-bold text-slate-400 uppercase block tracking-wider">Total Billed Amount</span>
                                        <span class="font-semibold text-emerald-600 font-mono text-[13px]">{formatCurrency(selectedRecord.totalBilledAmount)}</span>
                                    </div>
                                    <div>
                                        <span class="text-[10px] font-bold text-slate-400 uppercase block tracking-wider">Final Approved</span>
                                        <span class="font-semibold text-blue-600 font-mono text-[13px]">{formatCurrency(selectedRecord.finalApprovedAmount)}</span>
                                    </div>
                                    <div class="col-span-4 border-t pt-4">
                                        <span class="text-[10px] font-bold text-slate-400 uppercase block tracking-wider">Insurance Address</span>
                                        <p class="font-medium text-slate-700 bg-slate-50 p-2.5 rounded border leading-relaxed mt-1">{selectedRecord.insuranceAddress || "No address mapped."}</p>
                                    </div>
                                </div>
                                <footer class="p-3 border-t flex justify-end gap-2 bg-slate-50 rounded-b-xl">
                                    <button onClick={() => setIsViewModalOpen(false)} class="px-4 py-2 border bg-white rounded font-bold text-[10.5px] uppercase">Close</button>
                                </footer>
                            </div>
                        </div>
                    )}

                    {/* MODAL: Print Cover Letter */}
                    {isPrintModalOpen && selectedRecord && (
                        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 p-4 overflow-y-auto no-print">
                            <div class="bg-white rounded-xl shadow-2xl border border-slate-200 w-full max-w-4xl">
                                <header class="p-4 border-b flex items-center justify-between bg-slate-900 text-white rounded-t-xl">
                                    <h3 class="font-extrabold text-sm uppercase tracking-wide">Generate TPA Submission Cover Letter</h3>
                                    <button onClick={() => setIsPrintModalOpen(false)} class="text-slate-400 hover:text-white">
                                        <i data-lucide="x" class="h-5 w-5"></i>
                                    </button>
                                </header>
                                <div class="p-6 overflow-y-auto max-h-[70vh]">
                                    {/* Print Preview Layout */}
                                    <div id="cover-letter-print-area" class="border p-8 bg-white text-slate-800 text-[11px] leading-relaxed shadow-sm font-sans">
                                        <div class="flex justify-between items-start border-b pb-4 mb-4">
                                            <div>
                                                <h1 class="text-lg font-bold text-slate-900">MED-TPA CARE CENTER</h1>
                                                <p class="text-slate-500 font-medium">Claims Administration Department, Hospital HQ</p>
                                            </div>
                                            <div class="text-right">
                                                <p class="font-bold">Date: {new Date().toLocaleDateString('en-IN')}</p>
                                                <p class="text-slate-500 font-mono">REF: MED/TPA/{selectedRecord.serialNumber}</p>
                                            </div>
                                        </div>

                                        <p class="font-bold text-slate-900 uppercase">To,</p>
                                        <p class="font-bold text-slate-800 text-[11px]">{selectedRecord.tpaCompanyName || "TPA Administration"}</p>
                                        <p class="text-slate-600 italic whitespace-pre-wrap max-w-lg mb-4">{selectedRecord.insuranceAddress || "Insurance Address details"}</p>

                                        <p class="font-bold mb-3 border-b pb-1 text-slate-900">Subject: Physical Document Submission for Claim Claim Ref: {selectedRecord.claimNumber || "N/A"}</p>

                                        <p class="mb-4">Dear Sir/Madam,</p>
                                        <p class="mb-4">We are submitting herewith the medical claim records and supporting physical documents for inpatient treatment as detailed below. We request you to process the settlement at your earliest convenience.</p>

                                        <div class="border border-slate-200 rounded overflow-hidden mb-6">
                                            <table class="w-full text-left">
                                                <tbody class="divide-y divide-slate-100">
                                                    <tr class="bg-slate-50">
                                                        <td class="p-2 font-bold w-1/3">Patient Name</td>
                                                        <td class="p-2">{selectedRecord.patientName} ({selectedRecord.gender})</td>
                                                    </tr>
                                                    <tr>
                                                        <td class="p-2 font-bold">UHID / UID #</td>
                                                        <td class="p-2 font-mono">{selectedRecord.uhid}</td>
                                                    </tr>
                                                    <tr class="bg-slate-50">
                                                        <td class="p-2 font-bold">Policy / Member ID</td>
                                                        <td class="p-2 font-mono">{selectedRecord.policyNumber} / {selectedRecord.memberId}</td>
                                                    </tr>
                                                    <tr>
                                                        <td class="p-2 font-bold">Diagnosis / Surgery</td>
                                                        <td class="p-2">{selectedRecord.diagnosis} ({selectedRecord.surgeryName})</td>
                                                    </tr>
                                                    <tr class="bg-slate-50">
                                                        <td class="p-2 font-bold">Billed Amount</td>
                                                        <td class="p-2 font-mono font-bold text-slate-900">{formatCurrency(selectedRecord.totalBilledAmount)}</td>
                                                    </tr>
                                                    <tr>
                                                        <td class="p-2 font-bold">Approved Cashless Amount</td>
                                                        <td class="p-2 font-mono font-bold text-blue-600">{formatCurrency(selectedRecord.finalApprovedAmount)}</td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>

                                        <p class="mb-6">Please release the payment to our registered bank account as per the ECS mandate details on file.</p>
                                        
                                        <div class="flex justify-between items-end mt-8 pt-4 border-t">
                                            <div>
                                                <p class="font-bold">Authorised Signatory</p>
                                                <p class="text-slate-500">Billing Department</p>
                                            </div>
                                            <div class="text-right text-[9px] text-slate-400">
                                                <p>Generated via MED-TPA portal</p>
                                                <p class="font-mono">IP Ref: {selectedRecord.ipBillingNumber || "N/A"}</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <footer class="p-3 border-t bg-slate-50 flex justify-end gap-2 rounded-b-xl">
                                    <button onClick={() => setIsPrintModalOpen(false)} class="px-4 py-2 border bg-white rounded font-bold text-[10.5px] uppercase">Cancel</button>
                                    <button onClick={() => window.print()} class="px-5 py-2 rounded bg-blue-600 text-white font-bold text-[10.5px] uppercase flex items-center gap-1">
                                        <i data-lucide="printer" class="h-3.5 w-3.5"></i> Print Document
                                    </button>
                                </footer>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);

        // Refresh icons after render
        setTimeout(() => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }, 500);
    </script>
</body>
</html>
